<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Price Forecasting</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <style>
        body {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffecd2, #fcb69f);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto p-8 max-w-6xl">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-900">SPICE PRICE FORECASTING</h1>

        
        
        <div class="mb-8">
            <img src="{{ url_for('static', filename='spices.png') }}" alt="Assorted spices in wooden spoons" class="w-full h-auto rounded-lg shadow-lg">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div>
                <label for="fromDate" class="block text-sm font-medium text-gray-700 mb-2">From Date</label>
                <input type="date" id="fromDate" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="toDate" class="block text-sm font-medium text-gray-700 mb-2">To Date</label>
                <input type="date" id="toDate" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="itemSelect" class="block text-sm font-medium text-gray-700 mb-2">Select Spice</label>
                <select id="itemSelect" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">Select a spice</option>
                    <option value="Dhania">Dhania</option>
                    <option value="Turmeric-finger">Turmeric-finger</option>
                    <option value="Turmeric-bulb">Turmeric-bulb</option>
                    <option value="Kasuri Methi Leaves">Kasuri Methi Leaves</option>
                    <option value="Baisoda">Baisoda</option>
                    <option value="Black Salt">Black Salt</option>
                    <option value="Mustard">Mustard</option>
                    <option value="Tejpatra(Bay Leaves)">Tejpatra(Bay Leaves)</option>
                    <option value="Nutmeg">Nutmeg</option>
                    <option value="Dalchini">Dalchini</option>
                    <option value="Cardamom">Cardamom</option>
                    <option value="Cummin Seed(Jeera) ">Cummin Seed(Jeera)</option>
                    <option value="Cloves">Cloves</option>
                    <option value="Black Pepper">Black Pepper</option>
                    <option value="Mace">Mace</option>
                    <option value="Ajwain(Juani)">Ajwain(Juani)</option>
                    <option value="Kala Jeera">Kala Jeera</option>
                    <option value="Saha Jeera">Saha Jeera</option>
                    <option value="Red Chilli">Red Chilli</option>
                    <option value="Kashmiri chilli">Kashmiri chilli</option>
                </select>
            </div>
            <div class="flex items-end">
                <button id="fetchButton" class="w-full px-6 py-3 text-lg font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out transform hover:scale-105">
                    Fetch Data
                </button>
            </div>
        </div>
        
        <div id="loading" class="hidden text-center text-xl font-semibold text-indigo-700 mb-4">Loading...</div>
        <div id="error" class="hidden text-center text-xl font-semibold text-red-600 mb-4"></div>
        
        <div class="overflow-x-auto">
            <table id="dataTable" class="min-w-full divide-y divide-gray-200 hidden">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sl.No</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Spice Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Market</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Min Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Max Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Modal Price</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
       document.getElementById('fetchButton').addEventListener('click', async function() {
    const loadingElement = document.getElementById('loading');
    const errorElement = document.getElementById('error');
    const tableElement = document.getElementById('dataTable');
    const tableBody = document.getElementById('tableBody');

    loadingElement.classList.remove('hidden');
    errorElement.classList.add('hidden');
    tableElement.classList.add('hidden');

    try {
        const response = await axios.post('/api/fetch-data', {
            fromDate: document.getElementById('fromDate').value,
            toDate: document.getElementById('toDate').value,
            spice: document.getElementById('itemSelect').value
        });
        console.log("Received response:", response.data);
        const data = response.data;

        if (data.length === 0) {
            errorElement.textContent = 'No data found for the selected criteria.';
            errorElement.classList.remove('hidden');
            return;
        }

        tableBody.innerHTML = '';
        data.forEach((rowData, index) => {
            const row = `
                <tr>
                    <td class="px-4 py-2 border">${index + 1}</td>
                    <td class="px-4 py-2 border">${rowData['Spice Name']}</td>
                    <td class="px-4 py-2 border">${rowData['Country']}</td>
                    <td class="px-4 py-2 border">${rowData['Market']}</td>
                    <td class="px-4 py-2 border">${rowData['Min Price']}</td>
                    <td class="px-4 py-2 border">${rowData['Max Price']}</td>
                    <td class="px-4 py-2 border">${rowData['Modal Price']}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

        tableElement.classList.remove('hidden');
    } catch (error) {
        console.error("Error:", error);
        errorElement.textContent = 'Failed to fetch data. ' + error.message;
        errorElement.classList.remove('hidden');
    } finally {
        loadingElement.classList.add('hidden');
    }
});
    </script>
</body>
</html>
